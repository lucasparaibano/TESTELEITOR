<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>LEITOR INTELIGENTE</title>

  <!--
    Biblioteca usada:
    ZXing Browser 0.2.1
    - Leitura de códigos 1D e 2D diretamente no navegador.
    - O detector recebe somente o crop matemático da área de leitura.
    - Nenhuma imagem é enviada para um servidor pelo código abaixo.
  -->
  <script src="https://unpkg.com/@zxing/browser@0.2.1"></script>

  <style>
    :root {
      --bg: #0b1220;
      --panel: #111a2b;
      --panel2: #172235;
      --border: #27364f;
      --text: #f5f7fb;
      --muted: #9aa8bd;
      --primary: #2f80ed;
      --success: #20c997;
      --warning: #f2c94c;
      --danger: #eb5757;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(160deg, #08101d, #111a2b);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(720px, 100%);
      margin: 0 auto;
      padding: 20px 14px 30px;
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 6vw, 36px);
      letter-spacing: 1px;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .card {
      background: rgba(17, 26, 43, .96);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 14px 40px rgba(0,0,0,.22);
    }

    .camera-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 14px;
      background: #050a12;
      border: 1px solid var(--border);
    }

    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 30px;
      text-align: center;
      color: var(--muted);
      z-index: 2;
      pointer-events: none;
    }

    /*
      ÁREA FIXA DE LEITURA

      O tamanho padrão foi reduzido em relação à versão anterior:
      72% da largura x 18% da altura do visor.

      A área é propositalmente horizontal porque códigos de barras 1D
      normalmente ocupam uma faixa horizontal. Ela não pode mais ser
      redimensionada ou movida pelo usuário.
    */
    .roi {
      position: absolute;
      left: 14%;
      top: 41%;
      width: 72%;
      height: 18%;
      border: 3px solid #20c997;
      border-radius: 8px;
      z-index: 4;
      pointer-events: none;
      box-shadow:
        0 0 0 9999px rgba(0,0,0,.42),
        0 0 18px rgba(32,201,151,.45);
    }

    .roi-label {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 7px);
      transform: translateX(-50%);
      white-space: nowrap;
      background: rgba(0,0,0,.72);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: .5px;
    }

    .scan-line {
      position: absolute;
      left: 4%;
      right: 4%;
      top: 50%;
      height: 2px;
      background: rgba(32,201,151,.9);
      box-shadow: 0 0 8px rgba(32,201,151,.9);
    }

    .status {
      margin-top: 12px;
      min-height: 42px;
      padding: 11px 13px;
      border-radius: 10px;
      background: var(--panel2);
      color: var(--muted);
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .status.running { color: #8ed8ff; }
    .status.success { color: #75e6bd; }
    .status.warning { color: #ffe08a; }
    .status.error { color: #ff9a9a; }

    .progress {
      height: 3px;
      margin-top: 8px;
      overflow: hidden;
      border-radius: 99px;
      background: transparent;
      opacity: 0;
    }

    .progress.active {
      opacity: 1;
      background: var(--panel2);
    }

    .progress.active::after {
      content: "";
      display: block;
      width: 35%;
      height: 100%;
      background: var(--primary);
      animation: progress 1s infinite ease-in-out;
    }

    @keyframes progress {
      from { transform: translateX(-120%); }
      to { transform: translateX(310%); }
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 12px;
    }

    button {
      min-height: 48px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel2);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      padding: 10px 12px;
    }

    button:active { transform: scale(.98); }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    button.primary {
      background: var(--primary);
      border-color: var(--primary);
    }

    button.danger {
      background: rgba(235,87,87,.14);
      border-color: rgba(235,87,87,.45);
      color: #ffb0b0;
    }

    .result-title {
      margin: 20px 0 8px;
      font-size: 13px;
      font-weight: bold;
      color: var(--muted);
      letter-spacing: .7px;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #09111f;
      color: var(--text);
      padding: 14px;
      font: 700 20px/1.35 monospace;
      outline: none;
    }

    textarea:focus {
      border-color: var(--primary);
    }

    .method {
      margin-top: 9px;
      color: var(--muted);
      font-size: 13px;
    }

    .result-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 9px;
    }

    .hint {
      margin: 12px 2px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
    }

    @media (max-width: 480px) {
      main { padding: 12px 10px 24px; }
      .card { padding: 10px; }
      .camera-wrap { aspect-ratio: 4 / 3; }
      .controls { grid-template-columns: 1fr; }
      .result-actions { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>

<body>
<main>
  <header>
    <h1>LEITOR INTELIGENTE</h1>
    <p class="subtitle">Leitor de código de barras</p>
  </header>

  <section class="card">
    <div class="camera-wrap" id="cameraWrap">
      <video id="video" autoplay muted playsinline></video>

      <div class="placeholder" id="placeholder">
        <div>
          <strong>Câmera desligada</strong><br>
          Toque em "INICIAR LEITURA" para começar.
        </div>
      </div>

      <div class="roi" id="roi" aria-label="Área fixa de leitura">
        <span class="roi-label">ÁREA DE LEITURA</span>
        <span class="scan-line"></span>
      </div>
    </div>

    <div class="status" id="status">
      <span id="statusText">Aguardando início.</span>
    </div>

    <div class="progress" id="progress"></div>

    <div class="controls">
      <button class="primary" id="startBtn">INICIAR LEITURA</button>
      <button class="danger" id="stopBtn" disabled>PARAR LEITURA</button>
    </div>

    <p class="hint">
      Posicione o código dentro da moldura. O sistema tenta usar a câmera
      traseira principal e analisa somente os pixels dentro da área verde.
    </p>

    <div class="result-title">RESULTADO</div>

    <textarea id="result" readonly placeholder="O código lido aparecerá aqui..."></textarea>

    <div class="method">
      <strong>Método:</strong> <span id="method">—</span>
    </div>

    <div class="result-actions">
      <button id="copyBtn">COPIAR</button>
      <button id="clearBtn">LIMPAR</button>
    </div>
  </section>
</main>

<!--
  Canvas invisível.
  Ele recebe SOMENTE o recorte matemático da área verde antes de ser
  enviado ao ZXing. Portanto, textos/códigos fora da moldura não são
  analisados.
-->
<canvas id="cropCanvas" hidden></canvas>

<script>
"use strict";

/*
  ================================================================
  CONFIGURAÇÕES
  ================================================================

  Se quiser alterar futuramente o tamanho da área fixa, modifique:
    ROI.x      = distância da esquerda (%)
    ROI.y      = distância do topo (%)
    ROI.width  = largura (%)
    ROI.height = altura (%)

  A versão atual usa uma área horizontal de 72% x 18%.
*/
const ROI = {
  x: 14,
  y: 41,
  width: 72,
  height: 18
};

const SCAN_INTERVAL_MS = 160;

const video = document.getElementById("video");
const cameraWrap = document.getElementById("cameraWrap");
const placeholder = document.getElementById("placeholder");
const roi = document.getElementById("roi");
const cropCanvas = document.getElementById("cropCanvas");

const statusBox = document.getElementById("status");
const statusText = document.getElementById("statusText");
const progress = document.getElementById("progress");

const resultField = document.getElementById("result");
const methodField = document.getElementById("method");

const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const copyBtn = document.getElementById("copyBtn");
const clearBtn = document.getElementById("clearBtn");

let stream = null;
let running = false;
let scanTimer = null;
let barcodeReader = null;
let selectedCameraId = null;

/* Aplica a posição fixa da ROI. */
function applyROI() {
  roi.style.left = ROI.x + "%";
  roi.style.top = ROI.y + "%";
  roi.style.width = ROI.width + "%";
  roi.style.height = ROI.height + "%";
}

/*
  ================================================================
  CÂMERA PRINCIPAL
  ================================================================

  "facingMode: environment" sozinho NÃO garante a lente principal.
  Muitos celulares possuem:
    - câmera principal 1x;
    - grande-angular 0.5x;
    - teleobjetiva;
    - outras câmeras.

  Depois de obter uma permissão inicial, enumeramos as câmeras e damos
  prioridade a nomes que normalmente representam a câmera traseira
  principal. Também descartamos nomes que indiquem ultrawide/wide/0.5x.

  O navegador não fornece uma API universal dizendo "esta é a lente 1x".
  Por isso usamos uma seleção heurística. Em Android/Chrome, nomes como
  "camera2 0, facing back" normalmente correspondem à câmera principal.

  Se o aparelho não fornecer nomes úteis, mantemos a câmera traseira
  escolhida pelo navegador em vez de arriscar uma câmera inexistente.
*/

function cameraScore(device) {
  const label = (device.label || "").toLowerCase();

  let score = 0;

  // Penaliza lentes que normalmente são grande-angular/ultrawide.
  if (/ultra.?wide|ultrawide|wide angle|wide-angle|0\.5x|0,5x/.test(label)) {
    score -= 100;
  }

  if (/front|frontal|user facing/.test(label)) {
    score -= 200;
  }

  // Prioriza câmera traseira.
  if (/back|rear|environment|traseira/.test(label)) {
    score += 80;
  }

  // No Android Camera2, "camera2 0, facing back" é frequentemente a principal.
  if (/camera2\s*0/.test(label)) {
    score += 60;
  }

  // Índices baixos são normalmente as câmeras principais em muitos aparelhos.
  if (/\bcamera\s*0\b/.test(label)) {
    score += 35;
  }

  // Tele geralmente não é desejada para leitura próxima.
  if (/tele|zoom/.test(label)) {
    score -= 25;
  }

  return score;
}

async function chooseMainBackCamera() {
  /*
    A enumeração de devices normalmente só revela os labels depois que
    o usuário concede acesso à câmera. Por isso esta função é chamada
    após uma primeira abertura da câmera.
  */
  const devices = await navigator.mediaDevices.enumerateDevices();
  const cameras = devices.filter(d => d.kind === "videoinput");

  if (!cameras.length) return null;

  const ranked = [...cameras].sort((a, b) => cameraScore(b) - cameraScore(a));

  // Se não houver labels, não temos como distinguir as lentes.
  const hasUsefulLabels = cameras.some(c => c.label && c.label.trim());

  if (!hasUsefulLabels) return null;

  return ranked[0];
}

async function startCamera() {
  if (!navigator.mediaDevices?.getUserMedia) {
    throw new Error(
      "Este navegador não oferece acesso à câmera. Use uma versão recente do Chrome ou Safari."
    );
  }

  if (!window.isSecureContext && location.hostname !== "localhost") {
    throw new Error(
      "A câmera precisa de HTTPS. Abra o site por HTTPS, por exemplo pelo GitHub Pages."
    );
  }

  /*
    PRIMEIRA ETAPA:
    solicitamos a câmera traseira. Isso também libera os nomes dos
    dispositivos para enumerateDevices() em navegadores modernos.
  */
  let initialStream;

  try {
    initialStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        frameRate: { ideal: 30, max: 30 }
      }
    });
  } catch (error) {
    throw normalizeCameraError(error);
  }

  /*
    Agora que há permissão, tentamos identificar especificamente a
    câmera traseira principal.
  */
  let mainCamera = null;

  try {
    mainCamera = await chooseMainBackCamera();
  } catch (error) {
    console.warn("Não foi possível enumerar as câmeras:", error);
  }

  /*
    Se encontramos uma câmera específica e ela é diferente da inicial,
    trocamos para ela.
  */
  const initialTrack = initialStream.getVideoTracks()[0];
  const initialDeviceId = initialTrack?.getSettings?.().deviceId;

  if (mainCamera?.deviceId && mainCamera.deviceId !== initialDeviceId) {
    try {
      initialStream.getTracks().forEach(track => track.stop());

      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          deviceId: { exact: mainCamera.deviceId },
          width: { ideal: 1920 },
          height: { ideal: 1080 },
          frameRate: { ideal: 30, max: 30 }
        }
      });

      selectedCameraId = mainCamera.deviceId;
    } catch (error) {
      /*
        Se a câmera específica não puder ser aberta, voltamos à câmera
        traseira que o navegador conseguiu abrir inicialmente.
      */
      console.warn("Não foi possível selecionar a câmera principal:", error);

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });
      } catch (fallbackError) {
        throw normalizeCameraError(fallbackError);
      }
    }
  } else {
    stream = initialStream;
    selectedCameraId = initialDeviceId || null;
  }

  video.srcObject = stream;
  await video.play();

  placeholder.style.display = "none";

  if (video.readyState < 2) {
    await new Promise(resolve => {
      video.addEventListener("loadedmetadata", resolve, { once: true });
    });
  }

  /*
    Mostra no console qual câmera foi realmente selecionada.
    Isso ajuda a testar aparelhos diferentes.
  */
  const activeTrack = stream.getVideoTracks()[0];
  console.log("Câmera selecionada:", activeTrack?.label);
  console.log("Configuração:", activeTrack?.getSettings?.());
}

function normalizeCameraError(error) {
  if (!error) {
    return new Error("Não foi possível acessar a câmera.");
  }

  if (error.name === "NotAllowedError" || error.name === "SecurityError") {
    return new Error(
      "O navegador bloqueou o acesso à câmera. Verifique a permissão da câmera para este site."
    );
  }

  if (error.name === "NotFoundError") {
    return new Error("Nenhuma câmera foi encontrada neste dispositivo.");
  }

  if (error.name === "NotReadableError") {
    return new Error(
      "A câmera está sendo usada por outro aplicativo ou não pôde ser iniciada."
    );
  }

  if (error.name === "OverconstrainedError") {
    return new Error(
      "A câmera solicitada não está disponível neste aparelho."
    );
  }

  return new Error(
    "Não foi possível iniciar a câmera: " +
    (error.message || error.name || "erro desconhecido")
  );
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
  }

  stream = null;
  selectedCameraId = null;
  video.srcObject = null;
  placeholder.style.display = "grid";
}

/*
  ================================================================
  CROP MATEMÁTICO
  ================================================================

  O vídeo pode ser, por exemplo, 1920x1080 enquanto o elemento visual
  possui 390x220 ou outra proporção.

  Além disso, usamos object-fit: cover. Isso significa que parte da
  imagem real pode ficar fora do elemento visual.

  Por isso NÃO fazemos simplesmente:
      ROI% * video.videoWidth

  Primeiro calculamos a escala real usada pelo object-fit: cover e o
  deslocamento (crop) causado pela diferença de proporção.

  Depois convertemos a moldura visual em coordenadas dos pixels reais
  da câmera.

  O canvas final contém EXCLUSIVAMENTE a área verde.
*/
function getVideoCropRect() {
  const containerRect = cameraWrap.getBoundingClientRect();

  const sourceW = video.videoWidth;
  const sourceH = video.videoHeight;

  if (!sourceW || !sourceH) {
    throw new Error("A resolução da câmera ainda não está disponível.");
  }

  const roiLeft = containerRect.width * ROI.x / 100;
  const roiTop = containerRect.height * ROI.y / 100;
  const roiWidth = containerRect.width * ROI.width / 100;
  const roiHeight = containerRect.height * ROI.height / 100;

  /*
    object-fit: cover:
    a escala é determinada pelo maior fator necessário para preencher
    toda a caixa visual.
  */
  const scale = Math.max(
    containerRect.width / sourceW,
    containerRect.height / sourceH
  );

  const renderedW = sourceW * scale;
  const renderedH = sourceH * scale;

  const offsetX = (renderedW - containerRect.width) / 2;
  const offsetY = (renderedH - containerRect.height) / 2;

  const sourceX = (roiLeft + offsetX) / scale;
  const sourceY = (roiTop + offsetY) / scale;
  const sourceWROI = roiWidth / scale;
  const sourceHROI = roiHeight / scale;

  return {
    sx: Math.max(0, Math.floor(sourceX)),
    sy: Math.max(0, Math.floor(sourceY)),
    sw: Math.min(sourceW - Math.floor(sourceX), Math.floor(sourceWROI)),
    sh: Math.min(sourceH - Math.floor(sourceY), Math.floor(sourceHROI))
  };
}

/*
  Faz a captura real da ROI.

  Para código de barras, não aplicamos filtros, contraste ou grayscale
  antes da leitura. Isso preserva os detalhes finos das barras.
*/
function captureCrop() {
  const rect = getVideoCropRect();

  if (rect.sw <= 0 || rect.sh <= 0) {
    throw new Error("A área de leitura ficou fora da imagem da câmera.");
  }

  cropCanvas.width = rect.sw;
  cropCanvas.height = rect.sh;

  const ctx = cropCanvas.getContext("2d", {
    alpha: false,
    willReadFrequently: true
  });

  ctx.drawImage(
    video,
    rect.sx,
    rect.sy,
    rect.sw,
    rect.sh,
    0,
    0,
    rect.sw,
    rect.sh
  );

  return cropCanvas;
}

/*
  ================================================================
  CÓDIGO DE BARRAS
  ================================================================

  O ZXing recebe o canvas já recortado.

  Portanto ele NÃO recebe:
    - o vídeo inteiro;
    - os pixels fora da moldura;
    - a imagem completa da câmera.

  Formatos suportados pela biblioteca incluem, entre outros:
    EAN-13, EAN-8, UPC, Code 128, Code 39, ITF e QR Code.
*/
function tryBarcode(canvas) {
  if (!barcodeReader) {
    barcodeReader = new ZXingBrowser.BrowserMultiFormatReader();
  }

  try {
    const decoded = barcodeReader.decodeFromCanvas(canvas);
    const text = decoded?.getText?.() || "";

    return text.trim() || null;
  } catch (error) {
    // "Não encontrado" é normal durante a busca.
    return null;
  }
}

/*
  ================================================================
  LEITURA
  ================================================================
*/

async function startReading() {
  if (running) return;

  showResult("", "—");
  setProgress(true);
  setStatus("Iniciando câmera...", "running");

  startBtn.disabled = true;
  stopBtn.disabled = false;

  try {
    await startCamera();

    running = true;
    setStatus("Procurando código de barras...", "running");

    scanLoop();
  } catch (error) {
    running = false;
    setProgress(false);
    startBtn.disabled = false;
    stopBtn.disabled = true;

    setStatus(error.message || "Não foi possível iniciar a câmera.", "error");
  }
}

function scanLoop() {
  if (!running) return;

  try {
    /*
      Capture sempre antes de chamar o detector.
      Isso garante que o ZXing veja somente a ROI.
    */
    const crop = captureCrop();
    const barcode = tryBarcode(crop);

    if (barcode) {
      finishReading(barcode);
      return;
    }
  } catch (error) {
    console.warn("Falha na tentativa de leitura:", error);
  }

  scanTimer = setTimeout(scanLoop, SCAN_INTERVAL_MS);
}

function finishReading(code) {
  if (!running) return;

  /*
    Para código de barras, retornamos SOMENTE o conteúdo lido.
    Nenhum texto adicional é colocado no resultado.
  */
  showResult(code, "Código de barras");
  setStatus("✓ Código de barras detectado. Leitura concluída.", "success");
  setProgress(false);

  stopReading(false);
}

function stopReading(showMessage = true) {
  running = false;

  if (scanTimer) {
    clearTimeout(scanTimer);
    scanTimer = null;
  }

  stopCamera();

  startBtn.disabled = false;
  stopBtn.disabled = true;

  if (showMessage) {
    setStatus("Leitura interrompida.", "warning");
    setProgress(false);
  }
}

/*
  ================================================================
  INTERFACE
  ================================================================
*/

function setStatus(text, type = "") {
  statusText.textContent = text;
  statusBox.className = "status" + (type ? " " + type : "");
}

function setProgress(active) {
  progress.classList.toggle("active", active);
}

function showResult(text, method) {
  resultField.value = text || "";
  methodField.textContent = method || "—";
}

startBtn.addEventListener("click", startReading);

stopBtn.addEventListener("click", () => {
  stopReading(true);
});

clearBtn.addEventListener("click", () => {
  showResult("", "—");
  setStatus("Resultado limpo.", "");
});

copyBtn.addEventListener("click", async () => {
  const text = resultField.value.trim();

  if (!text) {
    setStatus("Não há código para copiar.", "warning");
    return;
  }

  try {
    await navigator.clipboard.writeText(text);
    setStatus("Código copiado.", "success");
  } catch {
    /*
      Fallback para navegadores/ambientes que não liberam Clipboard API.
    */
    resultField.removeAttribute("readonly");
    resultField.select();
    document.execCommand("copy");
    resultField.setAttribute("readonly", "readonly");
    window.getSelection()?.removeAllRanges();

    setStatus("Código copiado.", "success");
  }
});

/*
  Ao mudar orientação ou tamanho da janela, a ROI continua sendo
  calculada em porcentagem e, portanto, acompanha automaticamente
  o novo tamanho do visor.
*/
window.addEventListener("resize", applyROI);
window.addEventListener("orientationchange", () => {
  setTimeout(applyROI, 250);
});

/*
  Ao sair da página, desligamos a câmera.
  Nenhuma imagem é salva.
*/
window.addEventListener("pagehide", () => {
  running = false;

  if (scanTimer) {
    clearTimeout(scanTimer);
    scanTimer = null;
  }

  stopCamera();
});

/* Inicialização visual. */
applyROI();

if (!window.isSecureContext && location.hostname !== "localhost") {
  setStatus(
    "A câmera exige HTTPS. Use GitHub Pages ou outro endereço HTTPS.",
    "warning"
  );
}
</script>
</body>
</html>
